<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover" />
    <title>Chat test</title>
    <!-- The core runs the session manager: same origin frames only receive server push messages through their top window -->
    <script defer src="../sw/core.js"></script>
    <link rel="stylesheet" href="../common/theme.css">
    <link rel="stylesheet" href="../sw/ui.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--sw-canvas, var(--sw-bg));
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* One row of Sw ghost buttons above the chat (scrolls sideways when narrow, never covers the messages) */
        nav {
            flex: none;
            display: flex;
            flex-wrap: nowrap;
            gap: 4px;
            padding: 4px max(4px, env(safe-area-inset-right)) 4px max(4px, env(safe-area-inset-left));
            overflow-x: auto;
            scrollbar-width: thin;
            background: var(--sw-surface);
            border-bottom: 1px solid var(--sw-border);
        }

            nav .sw-button {
                flex: none;
                padding: 0 10px;
            }

        /* SwWeb:allow-element-css (the harness page has exactly one frame, the chat) */
        iframe {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            border: none;
        }
    </style>
</head>
<!-- SwWeb:no-page-header (a developer test harness of the chat frame commands) -->
<body class="sw-root">
    <!-- Developer test harness of the chat frame commands (not translated): each button posts {Type} to the embedded Chat.html -->
    <nav translate="no" aria-label="Chat test commands">
        <button type="button" class="sw-button sw-ghost" data-cmd="chat.clear" title="Clear all messages">Clear</button>
        <button type="button" class="sw-button sw-ghost" data-cmd="chat.scrolltop" title="Scroll to the top">Top</button>
        <button type="button" class="sw-button sw-ghost" data-cmd="chat.scrollbottom" title="Scroll to the bottom">Bottom</button>
        <button type="button" class="sw-button sw-ghost" data-cmd="chat.showall" title="Show the content of all messages">Show all</button>
        <button type="button" class="sw-button sw-ghost" data-cmd="chat.hideall" title="Hide the content of all messages">Hide all</button>
    </nav>
    <iframe title="Chat" data-src="Chat.html?id=Simple.Generic&options={%22UserColor%22:false}"></iframe>
    <script>
        "use strict";
        /** Post the command of a clicked button to the chat frame; log ViewProfile messages from it. */
        (() => {
            const frame = document.querySelector("iframe");
            //  The chat frame gets this page's theme (usetheme / settheme url flags): set the url once the deferred core is loaded
            document.addEventListener("DOMContentLoaded", () => {
                const u = frame.dataset.src;
                frame.src = window.Sw && Sw.Url && Sw.Url.AppendTheme ? Sw.Url.AppendTheme(u) : u;
            });
            document.querySelector("nav").addEventListener("click", ev => {
                const b = ev.target.closest("button[data-cmd]");
                if (b)
                    frame.contentWindow.postMessage({ Type: b.dataset.cmd }, "*");
            });
            window.addEventListener("message", ev => {
                if (ev.data && ev.data.Type === "ViewProfile")
                    console.log("ViewProfile: " + JSON.stringify(ev.data));
            });
        })();
    </script>
</body>
</html>
