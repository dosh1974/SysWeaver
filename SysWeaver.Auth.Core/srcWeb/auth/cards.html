<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="sw-card-css" content="none" />
    <!-- SwWeb:no-framework (not a page: card templates for Sw.Table, explore/README "Card templates") -->
    <title data-translation_context="Browser tab title of a file that only holds the card templates of the authorization tables, never shown to a user">Authorization cards</title>
</head>
<body>
    <!-- SimpleAuthorizer.Info (UsersTable), table by default -->
    <template id="user">
        <article class="sw-card sw-card-rich sw-tone-2">
            <header class="sw-card-lead">
                <span class="sw-card-tile sw-card-mono" aria-hidden="true" translate="no">${^Name}</span>
                <div class="sw-card-lead-text">
                    <h3>${Name}</h3>
                    <div class="sw-card-sub">${Domain}</div>
                </div>
            </header>
            <dl class="sw-facts">
                <div><dt data-translation_context="Label on the card of a user: the roles of the user">Roles</dt><dd>${+Auth}</dd></div>
            </dl>
        </article>
    </template>
</body>
</html>
