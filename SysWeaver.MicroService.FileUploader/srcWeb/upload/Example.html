<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title data-translation_context="Browser tab title of the example page that shows how files are uploaded to the server">Upload example</title>
    <script defer src="../sw/core.js"></script>
    <script defer src="../sw/ui.js"></script>
    <script defer src="../common/fileUploader.js"></script>
    <script defer src="example.js"></script>
    <link rel="icon" type="image/x-icon" href="../favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="../icon.svg">
    <link rel="apple-touch-icon" type="image/png" href="../apple-touch-icon.png">
    <link rel="manifest" href="../app/manifest.json">
    <link rel="stylesheet" href="../common/theme.css">
    <link rel="stylesheet" href="../sw/ui.css">
    <link rel="stylesheet" href="example.css">
</head>
<body class="sw-root" onload="exampleMain()">
    <main class="UploadExample sw-page-read">
        <header class="sw-ph">
            <div class="sw-ph-text">
                <h1 class="sw-ph-title" data-translation_context="Title of the upload example page (a test page for uploading files to a server repository)">Upload files</h1>
                <p class="sw-ph-desc" data-translation_context="One line description below the title of the upload example page">Upload files to a repository of this service and get a link to each file.</p>
            </div>
        </header>
        <label class="UploadRepo">
            <span data-translation_context="This is the label for an input field that let the user enter the name of a file repository to use when uploading files">Save to repository</span>
            <input data-translation_context="This is the placeholder text for an input field that let the user enter the name of a file repository to use when uploading files"
                   id="repo"
                   type="text"
                   autocomplete="off"
                   spellcheck="false"
                   placeholder="Enter a server repository name" />
        </label>
        <div data-translation_context="This is the tool tip text for an area that let the user upload file(s) to a server repository"
             title="Choose file(s) to upload, or drop file(s) here to upload them"
             id="drop">
            <span class="DropText" data-translation_context="This is the text inside an area that let the user upload file(s) to a server repository by selecting it (tap or click) or dropping files on it">Drop files here or select to choose</span>
        </div>
        <a target="_blank"
           rel="noopener"
           id="link"
           data-translation_context="This is the tool tip of a link to a file that was uploaded to a server"
           title="View or download the uploaded file">
        </a>
        <figure class="UploadUserImage">
            <img src="../auth/UserImages/Current/large"
                 id="userimage"
                 width="200" height="200"
                 alt="" />
            <figcaption data-translation_context="Caption under the user picture on the upload example page: the picture is an example of a file in the UserImage repository (uploading to that repository replaces it)">Example: your user picture, stored in the UserImage repository</figcaption>
        </figure>
    </main>
</body>
</html>
