<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>SysWeaver core contract test</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="../icon.svg">
    <link rel="stylesheet" href="../common/theme.css">
    <script>
        /*
         * Contract test of the documented core api (core/README "API reference") and the option-schema walker (Sw.DevOptions.Walk):
         *  - every documented function is called with its documented arguments and its documented return type / behaviour is asserted
         *    (a fix that changes a documented result, ex: a composer that returns undefined, fails here);
         *  - the walker lists every public Sw api that takes an options object and has no registered schema (Sw.DevOptions.Register).
         * No request leaves the page: fetch is replaced by an allow-list of mocks before the core loads (unknown requests are answered
         * 404 here and listed). Loads the source files; ?bundle loads the bundles. Result: window.SwContractTest = { Done, Problems,
         * Passed, Missing, Blocked }.
         */
        (function () {
            "use strict";
            var bundle = /[?&]bundle\b/i.test(location.search);
            var css = bundle ? ["../sw/ui.css"] : ["../ui/tokens.css", "../ui/components.css", "../ui/overlays.css", "../ui/cells.css", "../ui/icons.css", "../ui/page.css"];
            var js = bundle
                ? ["../sw/core.js", "../sw/ui.js"]
                : ["kernel.js", "base.js", "i18n.js", "url.js", "storage.js", "include.js", "format.js", "net.js", "interop.js", "session.js", "layout.js",
                    "session_start.js", "theme.js", "page.js",
                    "activity.js", "draft.js", "access.js", "init.js",
                    "../ui/base.js", "../ui/controls.js", "../ui/overlay.js", "../ui/layout.js", "../ui/editors.js", "../ui/cells.js", "../ui/page.js"];
            //  (the request mocks first: nothing the core does at load reaches the server)
            js.unshift("contractmock.js");
            //  (the README contracts generated by "SwWeb contracts": every documented name, its options and the composers' results)
            js.push("../sw/readme_contracts.js", "contracttest.js");
            css.forEach(function (h) {
                var l = document.createElement("link");
                l.rel = "stylesheet";
                l.href = h;
                document.head.appendChild(l);
            });
            js.forEach(function (s) {
                var e = document.createElement("script");
                e.src = s;
                e.async = false;
                document.head.appendChild(e);
            });
        })();
    </script>
    <style>
        .ct-main {
            padding: 16px;
            max-width: 1100px;
        }

        .ct-list {
            font-family: var(--sw-font-mono, monospace);
            font-size: var(--sw-text-sm, 13px);
            overflow-wrap: anywhere;
        }

        .ct-ok {
            color: var(--sw-ok);
        }

        .ct-bad {
            color: var(--sw-danger);
        }
    </style>
</head>
<body class="sw-page">
    <main class="ct-main">
        <h1>Core contract test</h1>
        <p id="ctState" role="status">Running…</p>
        <h2>Contract (core/README)</h2>
        <ol id="ctList" class="ct-list"></ol>
        <h2>Option schemas (Sw.DevOptions.Walk)</h2>
        <p id="ctWalk"></p>
        <ul id="ctMissing" class="ct-list"></ul>
    </main>
</body>
</html>
