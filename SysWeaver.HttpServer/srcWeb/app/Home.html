<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Home</title>
    <script defer src="../sw/core.js"></script>
    <script defer src="../sw/ui.js"></script>
    <script defer src="home.js"></script>
    <link rel="icon" type="image/x-icon" href="../favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="../icon.svg">
    <link rel="apple-touch-icon" type="image/png" href="../apple-touch-icon.png">
    <link rel="manifest" href="../app/manifest.json">
    <link rel="stylesheet" href="../common/theme.css">
    <link rel="stylesheet" href="../sw/ui.css">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="app.css">
</head>
<body class="sw-root" onload="homeMain()">
    <main class="Home sw-page-dash" data-appstart="${@EnvInfo.AppStart}" data-appversion="${@EnvInfo.AppVersion}" data-appbuild="${@EnvInfo.AppBuildTime}" data-nick="${@Session.NickName}">
        <header class="sw-ph HomeHead">
            <img draggable="false" class="UserImage" src="../auth/UserImages/Current/small" alt="" />
            <div class="sw-ph-text">
                <h1 class="sw-ph-title AppName" translate="no">${#EnvInfo.AppDisplayName}</h1>
                <p class="sw-ph-desc">
                    <span class="HomeGreeting" data-translation_context="Message used to welcome a user after they have logged in to their home page.${@Session.NickName} will be replaced with the logged in users name">Welcome ${#Session.NickName}.</span>
                    <span class="AppDescription" translate="no">${#EnvInfo.AppDescription}</span>
                </p>
            </div>
            <div class="sw-ph-status" hidden></div>
        </header>
        <section class="sw-grid HomeKpis"></section>
        <section class="sw-grid HomeCards" hidden></section>
        <p class="HomeHint"></p>
    </main>
</body>
</html>
