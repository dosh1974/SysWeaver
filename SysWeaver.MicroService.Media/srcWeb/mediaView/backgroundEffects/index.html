<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <!-- SwWeb:no-framework (a transparent render surface of the media player: no page chrome, themes or texts) -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
        Background effect: ?Effect=<name in this folder | .glsl url> (default SmoothBands) + effect params (Width, Height, Speed, ...).
        Shared logic and parameters: ../effectPage.js (url keys are case sensitive member names; other keys are shader variables).
        A lean page on purpose (no SysWeaver core): a transparent, non-interactive full window host for backgrounds and embeds.
    -->
    <script defer src="../parseTools.js"></script>
    <script defer src="../../common/anim.js"></script>
    <script defer src="../../mediaPlayer/media_player_tools.js"></script>
    <script defer src="../../mediaPlayer/media_effect_program.js"></script>
    <script defer src="../../mediaPlayer/media_player_effect.js"></script>
    <script defer src="../effectPage.js"></script>
    <style>
        :root {
            color-scheme: normal !important;
        }

        /* SwWeb:allow-element-css (a full window effect renderer without Sw components: the canvas fills the window) */
        html, body {
            background: none transparent !important;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

            body > * {
                pointer-events: none;
            }

        iframe {
            display: block;
            border: none;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body data-effect-page="background">
</body>
</html>
