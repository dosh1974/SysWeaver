<!doctype html>
<html>
<head>
    <script src="../parseTools.js"></script>
    <script>
        /*
            Parameters (basic):
                Effect = 	The effect to show

            Effects:
                    "Bubbles"
                    "Fireworks"
        */

        async function main() {

            const href = window.location.href;
            const p = new URL(href).searchParams;

            // MediaPlayerParamsEffect
            const props =
            {
                Width: 1920,
                Height: 1080,
                Speed: 1,
                LimitSize: false,
                DpiAdjust: false,
                DpiScale: 1,
                Static: false,
                Transparent: false,
                AdaptiveSize: true,
                WrapU: false,
                WrapY: false,
                WebGL2: false,
                MipMap: false,
                AntiAlias: false,
                ScrollId: null,
                MouseId: null,
                ImageSize: false,
                ShowVars: false,
            };


            //  Effect paramaters
            const fxParams =
            {

            };
            let effect = p.get("Effect") ?? "SmoothBands";
            if (!effect.endsWith(".glsl"))
                effect = "backgroundEffects/" + effect + ".glsl";

            //  Load parameters
            const subP = effect.indexOf('://') < 0 ? "../" : "";
            await ParseTools.FileToObject(subP + effect.substring(0, effect.lastIndexOf('.')) + ".json", props, (k, v) =>
                fxParams[k] = ParseTools.DecodeObject(v));

            //  Parse parameters
            ParseTools.ParamsToObject(p, props, (k, v) =>
                fxParams[k] = ParseTools.DecodeObject(v));

            //  Fix parameters
            props.FxProps = fxParams;

            //  Build url
            url = '../MediaPreview.html?transparent=true&link=' + effect + '&type=4&props=' + encodeURIComponent(JSON.stringify(props));
            if (p.has("ShaderDebug") && (p.get("ShaderDebug") === "true"))
                url += "&ShaderDebug=true";

            console.log(url);
            const c = document.createElement("iframe");
            ParseTools.MessageProxy(c);
            c.setAttribute("frameborder", "0");
            c.setAttribute("allowtransparency", "true");
            c.src = url;
            document.body.appendChild(c);

        }
    </script>
    <style>
        :root {
            color-scheme: normal !important;
        }
        html, body {
            background: none transparent !important;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            border: none;
            width: 100%;
            height: 100%;
            pointer-events: none;
            color-scheme: normal;
        }
    </style>
</head>
<body onload="main()">
</body>
</html>
