    <title>Image Effects Demo</title>
    <!-- Collage effect gallery (effectsLib.js): opens collageEffects/?Effect=<name>&Image=DemoCollage.svg.
    Collage effect page parameters (collageEffects/index.html, see effectPage.js):
	Parameters (basic):
		Effect = 		Name of the effect file to use, default = "Stripes".
		Image = 		Url to the image (use "../" to get to the site root).

	Parameters (common for all effect):
		Width = 		The width in pixels of the canvas, default 1920, ignored if AdaptiveSize = true.
		Height = 		The height in pixels of the canvas, default 1080, ignored if AdaptiveSize = true.
		Speed = 		A scale factor for the speed, default = 1.
		LimitSize = 	If true and AdaptiveSize is true the size of the canvas is limited to Width x Height pixels or Height x Width (if in portrait mode).
		DpiAdjust = 	Adjust for device DPI settings, default = true (if false and AdaptiveSize = true the resolution will be very low on mobile devices).
		DpiScale = 		Scale the quality, default = 1, must be less or equal to one.
		AdaptiveSize = 	If true, the size of the canvas will match the element size, else the Width x Height size will be used.
		ScrollId = 		Id of the element to read scroll information from, default element is top.document.body
		MouseId = 		Id of the element to read mouse position information from, default element is top.document.body
		AntiAlias = 	Antialias (true or false, default true).
		MipMap = 		Enable mip-maps for the texture, default false, if the texture is a non-power of two, WebGL2 needs to be used (and supported).
		WebGL2 = 		Use WebGL2, default false. Required for mip-maps of non-power of two textures, less supported.
	
	Effect specific parameters (different for each effect).
		First, if a .json file is present next to the image, parameters are read from that ("test.png", "test.json").
		Some common parameters for texture atlases (as used in the collages and their effects):

			TileCountX = Number of tiles per row, ex: 6.
			TileCountY = Number of rows of tiles, ex: 9.
			TileCount = Total number of tiles (TileCountX * TileCountY), ex: 54.
			TileWidth = Width in pixels of a "tile", ex: 328.
			TileHeight = Height in pixels of a "tile", ex: 188.
			PageWidth = Width in pixels of the whole image, ex: 1968.
			PageHeight = Height in pixels of the whole image, ex: 1692.
			ImageWidth = Width in pixels of an image in a tile, ex: 320.
			ImageHeight = Height in pixels of an image in a tile, ex: 180.
			UniqueCount = Number of unique images, ex: 50.
			Border = Number of transparent pixels surrounding the image in a tile, ex: 4.
			
		Any other url parameter is passed to the effect.
		
			3d-tiles (TileCountX, TileCountY, TileCount, ImageWidth, ImageHeight):
				FillWidth = [0, 1] how much of a grid square to fill, default: 0.5.
				PlaneCount = Number of planes with images, default: 16.
				PlaneSpread = How far between each plane is, default: 0.5.
				ZoomSpeed = How fast the camera moves, default: 0.5.
				GridScale = Size of the grid, default: 2.0.
				JitterStrength = [0, 1] how unaligned the images are, default: 0.9.
			Scroll (TileCountX, TileCountY, TileWidth, TileHeight):
				ReflectionStretch = How scaled the reflection is in relation to the original, default: 0.75.
				ReflectionIntensity	= [0, 1] intensity (opacity) of the reflection, default: 0.3.
				ScrollSpeed = How fast to scroll in images per second, default: 0.5.
				ScrollSpeedX = Speed of influence for the horizontal scroll bar position in pixels, default: 0.
				ScrollSpeedY = Speed of influence for the vertical scroll bar position in pixels, default: 0.
				ScrollSpeedRX = Speed of influence for the horizontal normalized scroll bar position [0, 1], default: 0.
				ScrollSpeedRY = Speed of influence for the vertical normalized scroll bar position [0, 1], default: 0.
				MouseSpeedX = Speed of influence for the horizontal mouse position. Where 1.0 matches the mouse speed, default: 0.
				MouseSpeedY = Speed of influence for the vertical mouse position. Where 1.0 matches the mouse speed, default: 0.
			Stripes (TileCountX, TileWidth, TileHeight):
			
			
			Wheel (TileCountX, TileCountY, TileCount, ImageWidth, ImageHeight, PageWidth, PageHeight)
				ScrollSpeed = How fast to scroll in images per second, default: 0.5.
				ScrollSpeedX = Speed of influence for the horizontal scroll bar position in pixels, default: 0.
				ScrollSpeedY = Speed of influence for the vertical scroll bar position in pixels, default: 0.
				ScrollSpeedRX = Speed of influence for the horizontal normalized scroll bar position [0, 1], default: 0.
				ScrollSpeedRY = Speed of influence for the vertical normalized scroll bar position [0, 1], default: 0.
				MouseSpeedX = Speed of influence for the horizontal mouse position. Where 1.0 matches the mouse speed, default: 0.
				MouseSpeedY = Speed of influence for the vertical mouse position. Where 1.0 matches the mouse speed, default: 0.
				ImageCount = Number of images on the wheel.
				LeftDist = Default 0.75, distance from left.
				ShadowDistTop = 0.1, distance for the shadow on the top.
				ShadowDistBottom = 1.0, distance for the shadow on the bottom.
				ShadowIntTop = 0.7, Intensity of shadow on top.
				ShadowIntBottom = 0.2, Intensity of shadow on the bottom.
				VingetteInt = 20, vingetting Intensity
				VingettePow = 1, vingetting power
				NoiseInt = 0.0, amount of noise
*/

    -->
