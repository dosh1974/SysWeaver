<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <!-- SwWeb:no-framework (an embeddable full window map for MapDemo and media slides: no page chrome; its pin label follows the OS scheme) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <style>
        /* SwWeb:allow-element-css (a full window map without Sw components: the map fills the window, the pin label is large) */
        html {
            --dpi: 1;
            --idpi: 1;
            --pinX: -50%;
            --pinY: -100%;
            --pinHeight: 96px;
            background-color: transparent;
            margin: 0;
            padding: 0;
            width: calc(var(--dpi) * 100vw);
            height: calc(var(--dpi) * 100vh);
            overflow: hidden;
            user-select: none;
        }

        /* SwWeb:allow-element-css (see html) */
        body {
            background-color: transparent;
            margin: 0;
            padding: 0;
            overflow: hidden;
            color: #e00;
            font-size: 200%;
        }

            body iframe {
                zoom: var(--dpi);
                opacity: 0;
                transition: opacity linear 0.1s;
                border: none;
                position: absolute;
                left: 50%;
                top: 50%;
                width: calc(100vw * var(--idpi) + 10px);
                height: calc(100vh * var(--idpi) + 140px);
                transform: translate(-50%, -50%);
            }


            body.Dark iframe {
                filter: invert(1) hue-rotate(180deg);
            }

            body.OpenDark iframe {
                filter: invert(1) hue-rotate(207deg) saturate(150%) brightness(80%);
            }

            body.NoInteraction iframe {
                pointer-events: none;
            }

            body.Show iframe {
                opacity: 1;
            }

            body.Show img {
                opacity: 1;
            }


            body.NoFade iframe {
                transition: none !important;
                opacity: 1 !important;
            }

            body.NoFade img {
                transition: none !important;
                opacity: 1 !important;
            }

            body img {
                pointer-events: none;
                opacity: 0;
                transition: opacity linear 0.1s;
                position: absolute;
                z-index: 1;
                width: auto;
                height: var(--pinHeight);
                left: 50vw;
                top: 50vh;
                transform: translate(var(--pinX), var(--pinY));
            }

            body a {
                position: absolute;
                z-index: 2;
                width: 100vw;
                height: 100vh;
                display: block;
                cursor: pointer;
            }

            body Map-Title {
                position: absolute;
                z-index: 2;
                width: 100vw;
                height: 100vh;
                display: block;
            }

            /* Inside the app shell (mapView.js): the "The pin is a picture from the link" caption of an own pin (top) and the badge of a
               link to another site (bottom). Lean page without theme.css: fixed neutral colors, readable on every map. */
            body Map-Caption,
            body Map-External {
                position: absolute;
                z-index: 3;
                left: 8px;
                max-width: calc(100vw - 16px);
                box-sizing: border-box;
                padding: 0.2em 0.6em;
                font: 15px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
                color: #1b1b1b;
                background: rgba(255, 255, 255, 0.94);
                border: 1px solid #767676;
                border-radius: 6px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                pointer-events: none;
            }

            body Map-Caption {
                top: 8px;
            }

            body Map-External {
                bottom: 8px;
            }

    </style>
    <title>Map View</title>
    <!--
        MapView.html?key=&center=&zoom=&language=&maptype=&dpi=&pin=&pinX=&pinY=&pinHeight= (+ interactive, link, title): see mapView.js.
        A lean page (embedded many times, captured headless): only the translation fallbacks of the core are loaded.
    -->
    <script defer src="../core/i18n.js"></script>
    <script defer src="mapView.js"></script>
    <link rel="icon" type="image/x-icon" href="../favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="../icon.svg">
    <link rel="apple-touch-icon" type="image/png" href="../apple-touch-icon.png">
    <link rel="manifest" href="../app/manifest.json">
</head>
<body>
</body>
</html>
