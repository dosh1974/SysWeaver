<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <meta charset="utf-8" />
        <title>${#Title}</title>
        <style>
            body {
                font-family: Tahoma, Verdana;
                font-size: 125%;
            }

            table, td, th {
                border: 1px solid rgba(0,0,0,0.25);
                border-collapse: collapse;
                white-space: nowrap
            }

            th {
                padding: 3px 0.5em;
                font-weight: bold;
                text-align: left;
            }

            a {
                text-decoration: none;
                color: inherit;
                font-style: italic;
                transition: box-shadow linear 0.1s;
            }

                a:visited {
                    color: inherit;
                }

                a:hover {
                    box-shadow: 0 -2px 0 #00f inset, 0 2px 0 #00f;
                }

                a:focus {
                    outline: none;
                    box-shadow: 0 -2px 0 #00f inset, 0 2px 0 #00f;
                }


            td {
                padding: 3px 0.5em;
            }

            .r {
                text-align: right;
            }

            .m {
                font-family: monospace, monospace;
            }

            .b
            {
                color: #600;
            }

            .n {
                color: #060;
            }

            .t {
                color: #00a;
            }


            tr:nth-child(2n) {
                background-color: rgba(0,0,128,0.05);
            }
        </style>
    </head>
    <body>
        <table>
${Rows}
        </table>
    </body>
</html>
